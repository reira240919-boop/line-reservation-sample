<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINE予約管理 全体図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* レイアウト: 白い板の上に2段の流れ図（上=予約する、下=予約のあと）。下に補足 */
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --fg: #1d2633;
    --muted: #5d6878;
    --book: #2f64a8;
    --book-soft: #6a9bd8;
    --after: #3f8a3c;
    --after-soft: #7fb87b;
    --store: #e8873a;
    --store-soft: #f3ac6e;
    --cli: #c2417a;
    --adm: #6b4fb3;
    --auto: #7a8494;
    --display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  @page { size: A4 landscape; margin: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    padding: 28px 16px 32px;
  }
  main { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
  .board { background: var(--card); border-radius: 16px; padding: 24px 20px 12px; }
  .scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 760px; height: auto; }
  .caption { text-align: center; color: var(--muted); font-size: 15px; letter-spacing: .04em; margin: 0; }
  .notes { justify-content: center; margin: 0 auto; color: var(--muted); font-size: 14px; line-height: 1.8; display: grid; gap: 4px; }
  .notes p { margin: 0; white-space: nowrap; }
  .notes strong { color: var(--fg); font-weight: 700; }
  @media print {
    body { zoom: .86; padding: 14px 16px 0; min-height: 0; }
  }

  /* 図の中の文字と色 */
  .h { font-family: var(--display); font-weight: 900; font-size: 26px; fill: var(--fg); }
  .name { font-family: var(--display); font-weight: 700; font-size: 18px; fill: var(--fg); text-anchor: middle; }
  .tech { font-family: var(--body); font-size: 13px; fill: var(--muted); text-anchor: middle; }
  .tag { font-family: var(--body); font-size: 13px; font-weight: 500; text-anchor: middle; }
  .paper { fill: var(--card); }
  .book { color: var(--book); }
  .after { color: var(--after); }
  .arrow-b { stroke: var(--book-soft); stroke-width: 4; fill: none; }
  .arrow-a { stroke: var(--after-soft); stroke-width: 4; fill: none; }
  .head-b { fill: var(--book-soft); }
  .head-a { fill: var(--after-soft); }
  .link { stroke: var(--after); stroke-width: 4; fill: none; }
  .db-body { fill: var(--store); }
  .db-top { fill: var(--store-soft); }
  .db-band { stroke: var(--card); stroke-width: 3; fill: none; }
  .on-color { fill: var(--card); }
  .pill-cli { fill: var(--cli); }
  .pill-adm { fill: var(--adm); }
  .pill-auto { fill: var(--auto); }
  .pill-t { font-family: var(--body); font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
  .legend { font-family: var(--body); font-size: 14px; font-weight: 500; fill: var(--fg); }
  .ln { stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .ol { stroke: currentColor; stroke-width: 3; stroke-linejoin: round; }
</style>
</head>
<body>
<main>
  <section class="board" aria-label="LINE予約管理の全体図">
    <div class="scroll">
      <svg viewBox="0 0 1200 650" role="img" aria-labelledby="fig-title">
        <title id="fig-title">予約する（LINEで開く → 日時を選んで入力 → 保存 → 確認メッセージ → 管理者に通知 → 管理画面で確認）と、予約のあと（設定 → 予約データ → 毎朝9時に確認 → お知らせ → 変更・キャンセル）の流れ</title>
        <defs>
          <marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="head-b" d="M0 0 L10 5 L0 10 z"/></marker>
          <marker id="ma" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="head-a" d="M0 0 L10 5 L0 10 z"/></marker>
          <marker id="ml" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path fill="var(--after)" d="M0 0 L10 5 L0 10 z"/></marker>

          <!-- LINE のメニューから開く（スマホ＋メニューのボタン） -->
          <g id="i-menu">
            <rect x="-30" y="-48" width="60" height="96" rx="9" class="paper ol"/>
            <path class="ln" d="M-8 -38 H8"/>
            <path class="ln" d="M-20 -24 H20 M-20 -12 H8"/>
            <rect x="-21" y="2" width="12" height="12" rx="2" fill="currentColor"/>
            <rect x="-6" y="2" width="12" height="12" rx="2" fill="currentColor" opacity=".6"/>
            <rect x="9" y="2" width="12" height="12" rx="2" fill="currentColor" opacity=".6"/>
            <rect x="-21" y="18" width="12" height="12" rx="2" fill="currentColor" opacity=".6"/>
            <rect x="-6" y="18" width="12" height="12" rx="2" fill="currentColor" opacity=".6"/>
            <rect x="9" y="18" width="12" height="12" rx="2" fill="currentColor" opacity=".6"/>
            <circle cx="0" cy="40" r="3.5" fill="currentColor"/>
          </g>

          <!-- 日時を選ぶ（カレンダー＋えんぴつ） -->
          <g id="i-cal">
            <rect x="-42" y="-38" width="76" height="80" rx="6" class="paper ol"/>
            <rect x="-42" y="-38" width="76" height="18" rx="6" fill="currentColor"/>
            <path class="ln" d="M-26 -46 V-32 M18 -46 V-32"/>
            <g fill="currentColor" opacity=".35">
              <rect x="-32" y="-12" width="12" height="10" rx="2"/><rect x="-14" y="-12" width="12" height="10" rx="2"/><rect x="4" y="-12" width="12" height="10" rx="2"/>
              <rect x="-32" y="4" width="12" height="10" rx="2"/><rect x="4" y="4" width="12" height="10" rx="2"/>
              <rect x="-32" y="20" width="12" height="10" rx="2"/><rect x="-14" y="20" width="12" height="10" rx="2"/>
            </g>
            <rect x="-14" y="4" width="12" height="10" rx="2" fill="currentColor"/>
            <path d="M44 -6 L54 4 L22 36 L10 38 L12 26 Z" fill="currentColor"/>
          </g>

          <!-- データベース -->
          <g id="i-db">
            <path class="db-body" d="M-36 -30 V30 A36 12 0 0 0 36 30 V-30 Z"/>
            <path class="db-band" d="M-36 -8 A36 12 0 0 0 36 -8 M-36 12 A36 12 0 0 0 36 12"/>
            <ellipse class="db-top" cx="0" cy="-30" rx="36" ry="12"/>
          </g>

          <!-- LINE のメッセージ（吹き出し＋チェック） -->
          <g id="i-msg">
            <path d="M-46 -36 H38 A8 8 0 0 1 46 -28 V18 A8 8 0 0 1 38 26 H-10 L-26 42 L-24 26 H-46 A8 8 0 0 1 -54 18 V-28 A8 8 0 0 1 -46 -36 Z" fill="currentColor" transform="translate(4 0)"/>
            <path d="M-34 -18 H30 M-34 -4 H30 M-34 10 H8" fill="none" stroke="var(--card)" stroke-width="4" stroke-linecap="round"/>
            <circle cx="40" cy="28" r="16" class="paper ol"/>
            <path class="ln" d="M33 28 L38 33 L47 23"/>
          </g>

          <!-- 管理者に通知（ベル） -->
          <g id="i-bell">
            <path d="M-30 22 C-24 14 -24 4 -24 -8 C-24 -26 -12 -38 0 -38 C12 -38 24 -26 24 -8 C24 4 24 14 30 22 Z" fill="currentColor"/>
            <rect x="-36" y="20" width="72" height="8" rx="4" fill="currentColor"/>
            <circle cx="0" cy="38" r="8" fill="currentColor"/>
            <circle cx="0" cy="-42" r="5" fill="currentColor"/>
            <path class="ln" d="M36 -30 A40 40 0 0 1 44 -6 M-36 -30 A40 40 0 0 0 -44 -6"/>
          </g>

          <!-- 予約を確認（管理画面の一覧） -->
          <g id="i-list">
            <rect x="-48" y="-40" width="96" height="66" rx="5" class="paper ol"/>
            <path class="ln" d="M-12 26 L-16 42 H16 L12 26 M-26 44 H26"/>
            <rect x="-38" y="-30" width="10" height="10" rx="2" fill="currentColor"/>
            <path class="ln" d="M-20 -25 H36"/>
            <rect x="-38" y="-14" width="10" height="10" rx="2" fill="currentColor"/>
            <path class="ln" d="M-20 -9 H36"/>
            <rect x="-38" y="2" width="10" height="10" rx="2" fill="currentColor" opacity=".5"/>
            <path class="ln" d="M-20 7 H20"/>
          </g>

          <!-- 設定（つまみ） -->
          <g id="i-set">
            <rect x="-44" y="-42" width="88" height="84" rx="8" class="paper ol"/>
            <path class="ln" d="M-30 -22 H30 M-30 0 H30 M-30 22 H30"/>
            <circle cx="12" cy="-22" r="8" fill="currentColor"/>
            <circle cx="-14" cy="0" r="8" fill="currentColor"/>
            <circle cx="20" cy="22" r="8" fill="currentColor"/>
          </g>

          <!-- 毎朝9時（時計） -->
          <g id="i-clock">
            <circle cx="0" cy="-2" r="42" fill="currentColor"/>
            <circle cx="0" cy="-2" r="33" class="paper"/>
            <path d="M0 -2 V-24 M0 -2 H-18" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <circle cx="0" cy="-2" r="4" fill="currentColor"/>
            <text x="-24" y="3" font-size="11" font-weight="700" text-anchor="middle" font-family="var(--body)" fill="currentColor">9</text>
          </g>

          <!-- 日程の変更・キャンセル（カレンダー＋まわる矢印） -->
          <g id="i-change">
            <rect x="-42" y="-38" width="70" height="76" rx="6" class="paper ol"/>
            <rect x="-42" y="-38" width="70" height="18" rx="6" fill="currentColor"/>
            <path class="ln" d="M-28 -46 V-32 M14 -46 V-32"/>
            <path class="ln" d="M-30 -6 H14 M-30 8 H0"/>
            <circle cx="32" cy="26" r="20" fill="currentColor"/>
            <path d="M22 22 A11 11 0 0 1 42 20 M42 30 A11 11 0 0 1 22 32" fill="none" stroke="var(--card)" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M44 13 V21 H36 M20 39 V31 H28" fill="none" stroke="var(--card)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- 誰の操作かを示す札 -->
          <g id="p-cli"><rect x="-36" y="-12" width="72" height="24" rx="12" class="pill-cli"/><text y="4.5" class="pill-t">予約者</text></g>
          <g id="p-adm"><rect x="-36" y="-12" width="72" height="24" rx="12" class="pill-adm"/><text y="4.5" class="pill-t">管理者</text></g>
          <g id="p-auto"><rect x="-30" y="-12" width="60" height="24" rx="12" class="pill-auto"/><text y="4.5" class="pill-t">自動</text></g>
        </defs>

        <!-- 凡例 -->
        <circle cx="660" cy="38" r="8" class="pill-cli"/>
        <text x="674" y="43" class="legend">予約する人（LINE）</text>
        <circle cx="830" cy="38" r="8" class="pill-adm"/>
        <text x="844" y="43" class="legend">管理する人（管理画面）</text>
        <circle cx="1030" cy="38" r="8" class="pill-auto"/>
        <text x="1044" y="43" class="legend">自動で動く</text>

        <!-- ===== 上の段：予約する ===== -->
        <text x="20" y="44" class="h">予約する（LINE の中で）</text>

        <g class="book">
          <use href="#i-menu" x="100" y="150"/>
          <use href="#i-cal" x="300" y="150"/>
          <use href="#i-msg" x="700" y="150"/>
          <use href="#i-bell" x="900" y="150"/>
          <use href="#i-list" x="1100" y="150"/>
        </g>
        <use href="#i-db" x="500" y="150"/>

        <use href="#p-cli" x="100" y="80"/>
        <use href="#p-cli" x="300" y="80"/>
        <use href="#p-cli" x="700" y="80"/>
        <use href="#p-adm" x="900" y="80"/>
        <use href="#p-adm" x="1100" y="80"/>

        <path class="arrow-b" d="M146 150 H236" marker-end="url(#mb)"/>
        <path class="arrow-b" d="M358 150 H436" marker-end="url(#mb)"/>
        <path class="arrow-b" d="M552 150 H634" marker-end="url(#mb)"/>
        <path class="arrow-b" d="M764 150 H836" marker-end="url(#mb)"/>
        <path class="arrow-b" d="M954 150 H1032" marker-end="url(#mb)"/>

        <text x="100" y="232" class="name">LINE で開く</text>
        <text x="100" y="256" class="tech">公式 LINE のメニューから</text>
        <text x="100" y="275" class="tech">LIFF（LINE の中で開く画面）</text>

        <text x="300" y="232" class="name">日時を選んで入力</text>
        <text x="300" y="256" class="tech">空いている日時だけ表示</text>
        <text x="300" y="275" class="tech">お名前・ご相談内容</text>

        <text x="500" y="232" class="name">データベースに保存</text>
        <text x="500" y="256" class="tech">Supabase（PostgreSQL）</text>
        <text x="500" y="275" class="tech">同じ枠の二重予約を防ぐ</text>

        <text x="700" y="232" class="name">確認メッセージが届く</text>
        <text x="700" y="256" class="tech">LINE Messaging API</text>
        <text x="700" y="275" class="tech">変更・キャンセルのリンクつき</text>

        <text x="900" y="232" class="name">管理者に通知</text>
        <text x="900" y="256" class="tech">管理者の LINE に届く</text>
        <text x="900" y="275" class="tech">日時・お名前・ご相談</text>

        <text x="1100" y="232" class="name">予約を確認</text>
        <text x="1100" y="256" class="tech">管理画面の予約一覧</text>
        <text x="1100" y="275" class="tech">メモ・キャンセルもできる</text>

        <!-- 同じ予約データを、お知らせにも使う -->
        <path class="link" d="M500 292 V404" marker-end="url(#ml)"/>
        <text x="514" y="352" class="tag" fill="var(--after)" style="text-anchor:start">同じ予約データをお知らせにも使う</text>

        <!-- ===== 下の段：予約のあと ===== -->
        <text x="20" y="390" class="h">予約のあと</text>

        <use href="#i-db" x="500" y="470"/>

        <use href="#p-adm" x="300" y="402"/>
        <use href="#p-auto" x="700" y="402"/>
        <use href="#p-cli" x="900" y="402"/>
        <use href="#p-cli" x="1100" y="402"/>
        <g class="after">
          <use href="#i-set" x="300" y="470"/>
          <use href="#i-clock" x="700" y="470"/>
          <use href="#i-msg" x="900" y="470"/>
          <use href="#i-change" x="1100" y="470"/>
        </g>

        <path class="arrow-a" d="M352 470 H452" marker-end="url(#ma)"/>
        <path class="arrow-a" d="M552 470 H640" marker-end="url(#ma)"/>
        <path class="arrow-a" d="M750 470 H834" marker-end="url(#ma)"/>
        <path class="arrow-a" d="M964 470 H1034" marker-end="url(#ma)"/>

        <text x="300" y="552" class="name">受付と文面を設定</text>
        <text x="300" y="576" class="tech">曜日ごとの受付時間・休み</text>
        <text x="300" y="595" class="tech">LINE で送る文面</text>

        <text x="500" y="552" class="name">予約データ</text>
        <text x="500" y="576" class="tech">予約日・お知らせを</text>
        <text x="500" y="595" class="tech">送ったかどうか</text>

        <text x="700" y="552" class="name">毎朝9時に確認</text>
        <text x="700" y="576" class="tech">Vercel Cron</text>
        <text x="700" y="595" class="tech">1日1回、自動で動く</text>

        <text x="900" y="552" class="name">お知らせが届く</text>
        <text x="900" y="576" class="tech">相談日の◯日前のリマインド</text>
        <text x="900" y="595" class="tech">当日の Zoom 案内</text>

        <text x="1100" y="552" class="name">変更・キャンセル</text>
        <text x="1100" y="576" class="tech">届いたリンクから操作</text>
        <text x="1100" y="595" class="tech">管理者にも LINE で通知</text>
      </svg>
    </div>
  </section>

  <p class="caption">LINE予約管理 全体図</p>

  <div class="notes">
    <p><strong>2つの入口：</strong>予約する人は LINE の中だけで操作します。管理する人は、パスワードで入る管理画面を使います。</p>
    <p><strong>管理画面でできること：</strong>予約一覧・メモ・キャンセル、曜日ごとの受付時間、休みの日と時間帯、LINE で送る文面の編集。</p>
    <p><strong>自動のお知らせ：</strong>毎朝9時に1回、リマインドと当日の Zoom 案内をまとめて送ります。同じ予約に二度は送りません。</p>
    <p><strong>変更の期限：</strong>予約した人が自分で変更・キャンセルできるのは、相談日の3日前までです。</p>
  </div>
</main>
</body>
</html>
